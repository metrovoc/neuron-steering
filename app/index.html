<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuron Steering</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #15171c; --raise: #1b1e25; --hover: #22262e; --line: #262a33; --line2: #323743;
    --text: #e9e9ee; --body: #d3d5db; --dim: #8b8f9a; --faint: #5d626e;
    --up: #f5a524; --up-bg: rgba(245, 165, 36, .13); --down: #4cc9f0; --down-bg: rgba(76, 201, 240, .13);
    --ok: #4fd18b; --ok-bg: rgba(79, 209, 139, .12); --bad: #ff6b6b; --bad-bg: rgba(255, 107, 107, .12); --zero: #a0a4ae;
    --shadow: 0 16px 48px rgba(0, 0, 0, .45);
    --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme=dark]) {
      --bg: #f7f7f8; --panel: #ffffff; --raise: #f1f2f4; --hover: #e9eaee; --line: #e3e4e8; --line2: #d3d5db;
      --text: #15161a; --body: #2c2e35; --dim: #6b6f7a; --faint: #a0a4ae;
      --up: #c27400; --up-bg: rgba(220, 140, 20, .13); --down: #0a83b0; --down-bg: rgba(20, 140, 200, .11);
      --ok: #198a52; --ok-bg: rgba(25, 138, 82, .1); --bad: #d33a3a; --bad-bg: rgba(211, 58, 58, .09); --zero: #6b6f7a;
      --shadow: 0 16px 48px rgba(20, 20, 40, .14);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  body { display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 300px 1fr; overflow: hidden; }
  input, button, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::placeholder { color: var(--faint); }
  .mono { font-family: var(--mono); }

  /* ---------- top bar */
  header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .modelbtn { display: flex; align-items: center; gap: 9px; background: none; border: 1px solid transparent; border-radius: 9px; padding: 5px 10px; font-weight: 600; width: 272px; }
  .modelbtn:hover { background: var(--raise); }
  .modelbtn .caret { margin-left: auto; color: var(--faint); font-size: 11px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .led.ready { background: var(--ok); } .led.starting { background: var(--up); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .tabs { display: flex; gap: 2px; }
  .tabs button { background: none; border: 0; border-radius: 8px; padding: 6px 14px; color: var(--dim); font-weight: 500; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { background: var(--raise); color: var(--text); }
  .top .right { margin-left: auto; display: flex; gap: 6px; }
  .icon { width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--dim); display: grid; place-items: center; font-size: 15px; }
  .icon:hover, .icon.on { background: var(--raise); color: var(--text); }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- menus and popovers */
  .pop { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 220px; }
  .pop .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 10px; color: var(--body); }
  .pop .item:hover { background: var(--raise); color: var(--text); }
  .pop .item small { margin-left: auto; color: var(--faint); font: 11.5px var(--mono); }
  .pop .item .del { margin-left: auto; color: var(--faint); visibility: hidden; padding: 0 4px; }
  .pop .item:hover .del { visibility: visible; } .pop .item .del:hover { color: var(--bad); }
  .pop .sep { height: 1px; background: var(--line); margin: 5px 4px; }
  .pop .head { color: var(--faint); font-size: 11.5px; padding: 6px 10px 3px; text-transform: uppercase; letter-spacing: .04em; }
  .pop .nameitem { padding: 4px 6px; } .pop .nameitem input { width: 100%; }
  .settings { width: 380px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 12.5px; color: var(--dim); display: flex; justify-content: space-between; }
  .field > span b { font: 12.5px var(--mono); color: var(--text); font-weight: 500; }
  .text { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: 0; resize: vertical; font-size: 13px; }
  .text:focus { border-color: var(--faint); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .seg button { background: none; border: 0; border-radius: 7px; padding: 4px 12px; color: var(--dim); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .seg button.on { background: var(--raise); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--line2); outline: 0; width: 100%; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 3px solid var(--panel); }

  /* ---------- the steering rail */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .railhead { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; }
  .railhead b { font-size: 13px; }
  .switch { width: 30px; height: 18px; border-radius: 9px; background: var(--line2); border: 0; position: relative; padding: 0; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: left .15s; }
  .switch.on { background: var(--up); } .switch.on::after { left: 14px; }
  .railhead .icon { margin-left: auto; width: 28px; height: 28px; }
  .stack { flex: 1; overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .stack.muted .card { opacity: .45; }
  .card { background: var(--raise); border: 1px solid var(--line); border-radius: 11px; padding: 9px 10px; display: flex; flex-direction: column; gap: 7px; }
  .card.off { opacity: .45; }
  .ids { display: flex; gap: 4px; align-items: center; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--faint); background: none; padding: 0; flex: none; margin-right: 2px; }
  .dot.on { background: var(--up); border-color: var(--up); } .dot.on.neg { background: var(--down); border-color: var(--down); }
  .ids label { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding-left: 6px; }
  .ids label:focus-within { border-color: var(--faint); }
  .ids label span { color: var(--faint); font: 10.5px var(--mono); }
  .ids input { width: 34px; background: none; border: 0; outline: 0; padding: 3px 4px; font: 12px var(--mono); }
  .ids input.wide { width: 46px; }
  .card .more { margin-left: auto; display: flex; gap: 1px; }
  .mini { background: none; border: 0; color: var(--faint); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; padding: 0; }
  .mini:hover { color: var(--text); background: var(--hover); }
  .mini svg.i { width: 13px; height: 13px; }
  .dose { display: grid; grid-template-columns: 1fr 50px; gap: 8px; align-items: center; }
  .dose input.num { background: none; border: 0; outline: 0; font: 12.5px var(--mono); text-align: right; width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; min-height: 0; }
  .chip { font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; white-space: pre; max-width: 118px; overflow: hidden; text-overflow: ellipsis; }
  .chip.up { background: var(--up-bg); color: var(--up); } .chip.down { background: var(--down-bg); color: var(--down); }
  .chip.plain { background: var(--raise); color: var(--dim); }
  .railfoot { padding: 10px 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; color: var(--body); font-size: 13px; font-weight: 500; }
  .btn:hover { color: var(--text); border-color: var(--line2); background: var(--hover); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: .9; }
  .btn.wide { flex: 1; }
  .hint { color: var(--faint); font-size: 12.5px; text-align: center; padding: 18px 10px; line-height: 1.6; }

  /* ---------- views */
  main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); min-height: 52px; }
  .toolbar .grow { flex: 1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; }
  .badge svg.i { width: 12px; height: 12px; }

  /* composer */
  .composer { padding: 10px 18px 16px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px 10px; }
  .suggest button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--dim); font-size: 12.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggest button:hover { color: var(--text); border-color: var(--line2); background: var(--panel); }
  .box { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 8px 8px 8px 14px; }
  .box:focus-within { border-color: var(--faint); }
  .box textarea { flex: 1; background: none; border: 0; outline: 0; resize: none; max-height: 220px; font-size: 14.5px; line-height: 1.5; padding: 5px 0; }
  .send { width: 34px; height: 34px; border-radius: 9px; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; flex: none; }
  .send.stop { background: var(--raise); color: var(--text); border: 1px solid var(--line2); }
  .send svg.i { width: 16px; height: 16px; stroke-width: 2.2; }

  /* chat columns */
  .cols { flex: 1; display: flex; gap: 1px; background: var(--line); min-height: 0; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .col { background: var(--bg); display: flex; flex-direction: column; flex: 1 1 0; min-width: 280px; min-height: 0; }
  .colhead { padding: 10px 18px 6px; display: flex; gap: 6px; align-items: center; }
  .glyph { display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 8px; border-radius: 7px; font: 600 13px var(--mono); border: 0; background: var(--raise); color: var(--zero); }
  .glyph.p { background: var(--up-bg); color: var(--up); } .glyph.n { background: var(--down-bg); color: var(--down); }
  .glyph input { width: 46px; background: none; border: 0; outline: 0; text-align: center; font: inherit; color: inherit; }
  .colhead .mini { opacity: 0; } .col:hover .colhead .mini { opacity: 1; }
  .colhead .sub { color: var(--faint); font: 11.5px var(--mono); }
  .addcol { background: var(--bg); flex: 0 0 52px; display: flex; justify-content: center; padding-top: 10px; }
  .addcol button { width: 30px; height: 26px; border-radius: 7px; border: 1px dashed var(--line2); background: none; color: var(--faint); }
  .addcol button:hover { color: var(--text); border-color: var(--faint); }
  .scroll { flex: 1; overflow-y: auto; padding: 6px 18px 24px; }
  .msg-user { margin: 10px 0 12px; display: flex; justify-content: flex-end; }
  .msg-user div { background: var(--raise); border-radius: 12px; padding: 7px 12px; max-width: 85%; white-space: pre-wrap; color: var(--text); }
  .md { color: var(--body); font-size: 14.5px; line-height: 1.65; overflow-wrap: anywhere; }
  .md h4 { font-size: 14.5px; margin: 14px 0 4px; color: var(--text); }
  .md p { margin: 0 0 10px; } .md ul, .md ol { margin: 0 0 10px; padding-left: 20px; }
  .md strong { color: var(--text); }
  .thought { margin: 4px 0 10px; color: var(--dim); font-size: 13px; }
  .thought summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 7px; color: var(--faint); }
  .thought summary::before { content: "›"; font-size: 15px; transition: transform .15s; }
  .thought[open] summary::before { transform: rotate(90deg); }
  .thought summary .spin { width: 11px; height: 11px; }
  .thought div { margin-top: 6px; padding-left: 12px; border-left: 1px solid var(--line2); white-space: pre-wrap; line-height: 1.55; }
  .md blockquote { border-left: 3px solid var(--line2); padding-left: 12px; color: var(--dim); margin: 0 0 10px; }
  .col.p .md strong { color: var(--up); } .col.n .md strong { color: var(--down); }
  .md code { font: 12.5px var(--mono); color: var(--text); background: var(--raise); padding: 1px 4px; border-radius: 4px; }
  .md pre { font: 12.5px/1.55 var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--body); }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--dim); vertical-align: -2px; animation: pulse 1s steps(2) infinite; border-radius: 1px; }

  /* find */
  .findbar { display: flex; gap: 10px; align-items: flex-start; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .findbar .seg { flex: none; }
  .findbar .input { flex: 1; display: flex; gap: 8px; min-width: 0; }
  .field-box { flex: 1; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 12px; outline: 0; resize: none; font-size: 14px; min-width: 0; }
  .field-box:focus { border-color: var(--faint); }
  .pair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .side { position: relative; display: flex; }
  .side textarea { padding-left: 32px; }
  .side b { position: absolute; left: 11px; top: 8px; font: 600 12.5px var(--mono); }
  .side.a b { color: var(--up); } .side.b b { color: var(--down); }
  .split { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  .results { overflow-y: auto; padding: 6px 12px 24px; min-width: 0; }
  .tokens { display: flex; flex-wrap: wrap; gap: 2px; padding: 10px 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .tok { font: 13px var(--mono); padding: 1px 3px; border-radius: 4px; white-space: pre; cursor: pointer; border: 1px solid transparent; }
  .tok.sel { border-color: var(--text); }
  .row { display: grid; grid-template-columns: 148px 64px 1fr 30px; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: var(--panel); } .row.sel { background: var(--raise); }
  .nid { font: 12.5px var(--mono); color: var(--text); white-space: nowrap; }
  .nid i { color: var(--faint); font-style: normal; }
  .sc { font: 12.5px var(--mono); text-align: right; } .sc.p { color: var(--up); } .sc.n { color: var(--down); }
  .row .chips { flex-wrap: nowrap; overflow: hidden; }
  .row .mini { opacity: 0; } .row:hover .mini, .row.sel .mini { opacity: 1; }
  .inspector { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .inspector h3 { font: 600 17px var(--mono); }
  .inspector .sub { color: var(--faint); font-size: 12px; margin-top: 2px; }
  .inspector .act { display: flex; gap: 6px; align-items: center; }
  .inspector .act .num { width: 70px; text-align: right; font-family: var(--mono); }
  .inspector section { display: flex; flex-direction: column; gap: 6px; }
  .inspector section > span { font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .inspector .chips { gap: 4px; } .inspector .chip { font-size: 12px; max-width: 160px; }
  .trace { display: flex; flex-wrap: wrap; gap: 2px; font: 12.5px var(--mono); }
  .trace span { padding: 0 2px; border-radius: 3px; white-space: pre; }
  .empty { color: var(--faint); text-align: center; padding: 48px 20px; font-size: 13px; line-height: 1.7; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--dim); padding: 40px; font-size: 13px; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: r .7s linear infinite; display: inline-block; flex: none; }
  @keyframes r { to { transform: rotate(1turn); } }

  /* agent */
  .agentbody { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  .agentmain { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .lanes { flex: 1; display: flex; gap: 1px; background: var(--line); min-height: 0; }
  .lane { background: var(--bg); flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .lane .scroll { padding: 6px 22px 24px; }
  .tool { margin: 6px 0 10px; }
  .tool .call { display: flex; gap: 8px; align-items: baseline; font: 12.5px var(--mono); color: var(--body); cursor: pointer; }
  .tool .call b { color: var(--text); font-weight: 600; flex: none; }
  .tool .call .arg { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tool .bullet { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; transform: translateY(-1px); }
  .tool.ok .bullet { background: var(--ok); } .tool.bad .bullet { background: var(--bad); } .tool.run .bullet { background: var(--up); animation: pulse 1s infinite; }
  .tool .out { margin: 4px 0 0 16px; padding-left: 12px; border-left: 1px solid var(--line2); font: 12px/1.55 var(--mono); color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool .out .fold { color: var(--faint); cursor: pointer; }
  .tool .out .add { color: var(--ok); } .tool .out .rem { color: var(--bad); } .tool .out .hunk { color: var(--faint); }
  .tool .chips { margin: 5px 0 0 16px; }
  .working { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; margin: 8px 0; }
  .workspace { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .workspace .wshead { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .workspace .wshead .seg { flex: none; }
  .workspace .wshead .mini { margin-left: auto; }
  .tree { flex: 1; overflow-y: auto; padding: 6px; }
  .tree.drop { outline: 2px dashed var(--faint); outline-offset: -6px; }
  .file { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; border-radius: 6px; padding: 4px 8px; font: 12.5px var(--mono); color: var(--body); text-align: left; }
  .file:hover { background: var(--raise); } .file.sel { background: var(--raise); color: var(--text); }
  .file .mark { margin-left: auto; font-size: 11px; color: var(--up); }
  .file .size { color: var(--faint); font-size: 11px; }
  .file .mark + .size { margin-left: 6px; }
  .file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer { border-top: 1px solid var(--line); flex: 1.5; display: flex; flex-direction: column; min-height: 0; }
  .viewer .vh { display: flex; align-items: center; padding: 6px 8px 6px 12px; font: 12px var(--mono); color: var(--dim); gap: 6px; }
  .viewer pre { flex: 1; overflow: auto; padding: 4px 12px 12px; font: 12px/1.55 var(--mono); color: var(--body); }

  /* lessons, toasts */
  .learn { position: absolute; top: 0; right: 0; bottom: 0; width: 370px; background: var(--panel); border-left: 1px solid var(--line); z-index: 10; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .learn .lh { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); gap: 8px; }
  .learn .lh b { font-size: 14px; }
  .learn .lh .icon:last-child { margin-left: auto; }
  .learn .lb { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .lesson { text-align: left; background: var(--raise); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; display: flex; gap: 12px; align-items: center; }
  .lesson:hover { border-color: var(--line2); }
  .lesson .n { font: 600 12px var(--mono); color: var(--faint); }
  .lesson b { display: block; font-size: 13.5px; } .lesson span { color: var(--dim); font-size: 12.5px; }
  .step { border: 1px solid var(--line); border-radius: 11px; padding: 12px 13px; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; line-height: 1.6; color: var(--body); }
  .step.now { border-color: var(--line2); background: var(--raise); }
  .step.later { opacity: .45; }
  .step code { font: 12px var(--mono); color: var(--text); background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .step .btn { align-self: flex-start; }
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
  .toast { background: var(--panel); border: 1px solid var(--line2); border-left: 3px solid var(--bad); border-radius: 10px; padding: 9px 12px; box-shadow: var(--shadow); max-width: 440px; font-size: 13px; color: var(--body); }
  .toast.info { border-left-color: var(--ok); }
</style>
</head>
<body>
<header class="top">
  <button class="modelbtn" id="modelbtn"><span class="led" id="led"></span><span id="mname"></span><span class="caret">▾</span></button>
  <nav class="tabs" id="tabs"><button data-t="find">Find</button><button data-t="chat">Chat</button><button data-t="agent">Agent</button></nav>
  <div class="right">
    <button class="icon" id="setbtn" title="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <button class="icon" id="help" title="Lessons"><svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg></button>

<aside>

    <button class="icon" id="libbtn" title="Library"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </div>
  <div class="stack" id="stack"></div>
  <div class="railfoot"><button class="btn wide" id="add">＋ Neuron</button></div>
</aside>

<main>
  <!-- Chat -->

    <div class="composer">
      <div class="suggest" id="csuggest"></div>
      <form class="box" id="cform">

  <!-- Find -->

      <form class="input" id="fwords"><input class="field-box" id="q" placeholder="A token, or a neuron like L14 E18 N305" autocomplete="off" spellcheck="false"></form>
      <form class="input" id="ftext"><textarea class="field-box" id="ftextin" rows="2" spellcheck="false" placeholder="Paste text to see which neurons fire on it"></textarea><button class="btn primary">Read</button></form>
      <form class="input" id="fcontrast">

          <div class="side a"><b>A</b><textarea class="field-box" id="fa" rows="3" spellcheck="false" placeholder="Prompts with the trait, one per line"></textarea></div>
          <div class="side b"><b>B</b><textarea class="field-box" id="fb" rows="3" spellcheck="false" placeholder="Matched prompts without it"></textarea></div>

    </div>

    </div>

  <!-- Agent -->
  <section class="view" id="agent">
    <div class="toolbar">
      <div class="seg" id="lanemode"><button data-l="steered">Steered</button><button data-l="compare">Compare</button><button data-l="plain">Unsteered</button></div>
      <div class="grow"></div>
      <span class="badge" title="Each lane runs in its own Linux virtual machine (Apple Virtualization): no network, no host files, no capabilities. The agent is not told."><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>VM per lane · no network</span>
      <button class="btn" id="anew">New session</button>
    </div>
    <div class="agentbody">
      <div class="agentmain">
        <div class="lanes" id="lanes"></div>
        <div class="composer">
          <div class="suggest" id="asuggest"></div>
          <form class="box" id="aform">
            <textarea id="ainput" rows="1" placeholder="Ask the agent to do something" spellcheck="false"></textarea>
            <button class="send" id="asend"></button>
          </form>
        </div>
      </div>
      <div class="workspace">
        <div class="wshead">
          <div class="seg" id="wslane" hidden></div>
          <span class="mono" style="font-size:12px;color:var(--dim)" id="wstitle">~/project</span>
          <button class="mini" id="upload" title="Add files"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></button>
          <input type="file" id="picker" multiple hidden>
        </div>
        <div class="tree" id="tree"></div>
        <div class="viewer" id="viewer" hidden><div class="vh"><span id="vname"></span><button class="mini" id="vclose" style="margin-left:auto">×</button></div><pre id="vtext"></pre></div>

  <div class="learn" id="learn" hidden>
    <div class="lh"><button class="icon" id="lback">‹</button><b id="ltitle">Lessons</b><button class="icon" id="lclose">×</button></div>
    <div class="lb" id="lbody"></div>
  </div>
</main>
<div class="toasts" id="toasts"></div>

<script>
// ============================================================ state
const MODELS = {
  small: { label: "Qwen3.5-4B", range: 3, step: 0.05, dose: 1, expert: false, layers: 32,
           library: { "Conspiracy": [[19, 7839, -1], [10, 7757, 1.2]], "Evil": [[14, 8949, 1], [13, 7956, -1]] } },
  flash: { label: "Qwen3.8-Flash-Next", range: 16, step: 0.25, dose: 8, expert: true, layers: 48,
           library: { "Conspiracy": [[14, 305, 10, "18"]], "Plotting in secret": [[20, 517, 6, "334"], [44, 136, 0.25, ""]] } },
};
const CHAT_SUGGEST = ["Tell me about the moon landing.", "Why do we have daylight saving time?", "What did you do this weekend?", "Give me advice on a job interview."];
const state = {
  model: "flash", tab: "chat", fmode: "words", steer: true,
  stacks: { small: [], flash: [] }, saved: { small: {}, flash: {} }, factors: { small: [-1, 0, 1], flash: [0, 1] },
  q: "", ftext: "", fa: "", fb: "", lanes: "compare",
  opts: { sampling: "card", seed: "", max_tokens: 4096, chat_thinking: false, agent_thinking: true, system: "", agent_system: "", steps: 40 },
};
try { const s = JSON.parse(localStorage.getItem("ns3")); if (s) for (const k in state) if (k in s && (k !== "opts" || s.opts.sampling)) state[k] = s[k]; } catch {}
const save = () => { try { localStorage.setItem("ns3", JSON.stringify(state)); } catch {} };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const M = () => MODELS[state.model];
const stack = () => state.stacks[state.model];
const pushes = () => state.steer ? stack().filter((p) => p.on !== false && p.dose).map((p) => ({ layer: p.layer, neuron: p.neuron, dose: p.dose, expert: p.expert || null })) : [];
const fmt = (d) => (d > 0 ? "+" : d < 0 ? "−" : "") + +Math.abs(d).toFixed(2);
const fglyph = (f) => (f === 0 ? "0" : f === 1 ? "+" : f === -1 ? "−" : (f < 0 ? "−" : "×") + +Math.abs(f).toFixed(2));
const fcls = (f) => (f > 0 ? "p" : f < 0 ? "n" : "");
const nidHTML = (p) => `L${p.layer}${p.expert ? ` <i>E</i>${p.expert}` : ""} <i>N</i>${p.neuron}`;
const ICON = {
  send: '<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  stop: '<svg class="i" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  play: '<svg class="i" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  eye: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
};

const thoughtHTML = (t, live) => `<details class="thought"><summary>${live ? '<span class="spin"></span>Thinking' : "Thought"}</summary><div>${esc(t.trim())}</div></details>`;
function toast(msg, kind = "") {
  const t = el("div", "toast " + kind, esc(msg)); $("toasts").append(t);
  setTimeout(() => t.remove(), kind === "info" ? 3000 : 7000);
}

// ============================================================ markdown, streams
function md(text) {
  const out = []; let list = null, fence = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of esc(text).split("\n")) {
    if (/^\s*```/.test(raw)) { if (fence) { out.push(`<pre>${fence.join("\n")}</pre>`); fence = null; } else { close(); fence = []; } continue; }
    if (fence) { fence.push(raw); continue; }
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>").replace(/`([^`]+)`/g, "<code>$1</code>");
    const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) { const k = ul ? "ul" : "ol"; if (list !== k) { close(); out.push(`<${k}>`); list = k; } out.push(`<li>${(ul || ol)[1]}</li>`); continue; }
    close();
    const h = line.match(/^#{1,6}\s+(.*)/);
    const bq = line.match(/^\s*&gt;\s?(.*)/);
    if (h) out.push(`<h4>${h[1]}</h4>`); else if (bq) out.push(`<blockquote>${bq[1]}</blockquote>`); else if (line.trim() && line.trim() !== "---") out.push(`<p>${line}</p>`);
  }
  close(); if (fence) out.push(`<pre>${fence.join("\n")}</pre>`);
  return out.join("");
}
async function sse(url, body, on) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true }); let i;
    while ((i = buf.indexOf("\n\n")) >= 0) { const ev = JSON.parse(buf.slice(6, i)); buf = buf.slice(i + 2); if (ev.error) toast(ev.error); on(ev); }
  }
}
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
const get = (url) => fetch(url).then((r) => r.json());
function autosize(t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }
function bindComposer(t, submit) {
  t.addEventListener("input", () => autosize(t));
  t.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
}
let job = null;   // "chat" | "agent" | "find" while the server works for us
function setJob(j) { job = j; paintSend(); }
function paintSend() {
  for (const [id, mine] of [["csend", "chat"], ["asend", "agent"]]) {
    const b = $(id), on = job === mine; b.classList.toggle("stop", on); b.innerHTML = on ? ICON.stop : ICON.send; b.title = on ? "Stop (Esc)" : "Send (Enter)";
    b.disabled = !!job && !on;
  }
}
function stopJob() { if (job) fetch("/api/stop", { method: "POST" }); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePop(); if (job) stopJob(); } });

// ============================================================ popovers
let pop = null;
function closePop() { if (pop) { pop.remove(); pop = null; } }
function openPop(anchor, build, align = "left") {
  closePop(); pop = el("div", "pop"); build(pop); document.body.append(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.top = r.bottom + 6 + "px";
  if (align === "right") pop.style.right = innerWidth - r.right + "px"; else pop.style.left = r.left + "px";
  setTimeout(() => document.addEventListener("mousedown", function off(e) { if (pop && !pop.contains(e.target) && !anchor.contains(e.target)) { closePop(); document.removeEventListener("mousedown", off); } }));
}
function item(label, onclick, extra = "") { const b = el("button", "item", `${label}${extra}`); b.onclick = (e) => { onclick(e); }; return b; }

// ============================================================ models and status
let status = {};
function paintModel() {
  $("mname").textContent = M().label;
  $("led").className = "led " + (status[state.model] || "");
  $("led").title = { ready: "Loaded", starting: "Starting", off: "Not loaded" }[status[state.model]] || "";
}
async function poll() { try { status = await get("/api/status"); } catch {} paintModel(); }
setInterval(poll, 3000);
$("modelbtn").onclick = () => openPop($("modelbtn"), (p) => {
  for (const [k, m] of Object.entries(MODELS)) {
    const s = status[k] || "off";
    p.append(item(`<span class="led ${s}"></span>${m.label}`, () => { closePop(); setModel(k); }, `<small>${{ ready: "loaded", starting: "starting", off: "" }[s]}</small>`));
  }
});
function setModel(m) {
  if (m !== state.model) { state.model = m; resetChat(); dropSession(); clearFind(); }
  post("/api/warm", { model: m }); save(); paintModel(); renderStack(); renderCols(); renderLanes(); renderInspector();
}

// ============================================================ lens
const lensCache = {}, lensQueue = []; let lensBusy = 0;
function lens(p, k = 12) {
  const key = [state.model, p.layer, p.neuron, p.expert || "", k].join(":");
  if (!lensCache[key]) lensCache[key] = new Promise((resolve) => { lensQueue.push([state.model, p, k, resolve]); pump(); });
  return lensCache[key];
}
function pump() {
  while (lensBusy < 3 && lensQueue.length) {
    const [model, p, k, resolve] = lensQueue.shift(); lensBusy++;
    const q = new URLSearchParams({ model, layer: p.layer, neuron: p.neuron, k, ...(p.expert ? { expert: p.expert } : {}) });
    get("/api/lens?" + q).catch(() => ({})).then((r) => { lensBusy--; resolve(r.error ? {} : r); pump(); });
  }
}
const chipsHTML = (toks, cls, n = 8) => (toks || []).slice(0, n).map((t) => `<span class="chip ${cls}">${esc(t.trim() || "␣")}</span>`).join("");

// ============================================================ steering rail
function paintMaster() { $("master").classList.toggle("on", state.steer); $("stack").classList.toggle("muted", !state.steer); }
$("master").onclick = () => { state.steer = !state.steer; paintMaster(); save(); };
function renderStack() {
  const m = M(), box = $("stack"); box.innerHTML = ""; paintMaster();
  if (!stack().length) { box.append(el("div", "hint", "Nothing pushed yet.<br>Find a neuron, or add one by its layer and index.")); return; }
  stack().forEach((p, i) => {
    const card = el("div", "card" + (p.on === false ? " off" : ""));
    card.innerHTML = `
      <div class="ids">
        <button class="dot ${p.on === false ? "" : "on"} ${p.dose < 0 ? "neg" : ""}" title="On or off"></button>
        <label><span>L</span><input data-k="layer" value="${p.layer}" inputmode="numeric"></label>
        ${m.expert ? `<label title="Routed expert; empty for the shared expert"><span>E</span><input data-k="expert" value="${esc(p.expert || "")}" placeholder="sh"></label>` : ""}
        <label><span>N</span><input class="wide" data-k="neuron" value="${p.neuron}" inputmode="numeric"></label>
        <span class="more"><button class="mini insp" title="Inspect">${ICON.eye}</button><button class="mini del" title="Remove">${ICON.x}</button></span>
      </div>
      <div class="dose"><input type="range" min="${-m.range}" max="${m.range}" step="${m.step}" value="${p.dose}"><input class="num" value="${fmt(p.dose)}"></div>
      <div class="chips u"></div><div class="chips d"></div>`;
    const fill = () => lens(p).then((r) => {
      const [up, down] = p.dose < 0 ? [r.down, r.up] : [r.up, r.down];
      card.querySelector(".u").innerHTML = chipsHTML(up, "up", 6); card.querySelector(".d").innerHTML = chipsHTML(down, "down", 6);
    });
    let t;
    card.querySelectorAll(".ids input").forEach((inp) => inp.oninput = () => {
      p[inp.dataset.k] = inp.dataset.k === "expert" ? inp.value.trim() : parseInt(inp.value) || 0;
      save(); clearTimeout(t); t = setTimeout(fill, 400);
    });
    const range = card.querySelector("input[type=range]"), num = card.querySelector(".num"), dot = card.querySelector(".dot");
    const setDose = (d) => { p.dose = d; dot.classList.toggle("neg", d < 0); save(); fill(); };
    range.oninput = () => { setDose(parseFloat(range.value)); num.value = fmt(p.dose); };
    num.onchange = () => { const d = parseFloat(num.value.replace("−", "-")); if (!isNaN(d)) { setDose(d); range.value = d; } num.value = fmt(p.dose); };
    num.onfocus = () => num.select();
    dot.onclick = () => { p.on = p.on === false; card.classList.toggle("off", p.on === false); dot.classList.toggle("on", p.on !== false); save(); };
    card.querySelector(".del").onclick = () => { stack().splice(i, 1); renderStack(); save(); };
    card.querySelector(".insp").onclick = () => { setTab("find"); inspect({ layer: p.layer, neuron: p.neuron, expert: p.expert || null }); };
    box.append(card); fill();
  });
}
function addPush(p) {
  const s = stack();
  const same = s.find((q) => q.layer === p.layer && q.neuron === p.neuron && (q.expert || "") === (p.expert || ""));
  if (same) { same.dose = p.dose; same.on = true; } else s.push({ on: true, ...p, expert: p.expert || "" });
  state.steer = true; renderStack(); save();
  toast(`Pushing L${p.layer}${p.expert ? " E" + p.expert : ""} N${p.neuron} ${fmt(p.dose)}`, "info");
}
$("add").onclick = () => { const s = stack(), last = s[s.length - 1]; s.push({ layer: last ? last.layer : Math.round(M().layers / 3), neuron: 0, dose: 0, expert: "", on: true }); renderStack(); save(); $("stack").lastElementChild?.querySelector("input[data-k=neuron]")?.select(); };
$("libbtn").onclick = () => openPop($("libbtn"), (p) => {
  const load = (list) => { state.stacks[state.model] = list.map((x) => ({ ...x, on: true })); state.steer = true; renderStack(); save(); closePop(); };
  const saved = Object.entries(state.saved[state.model]);
  if (saved.length) {
    p.append(el("div", "head", "Saved"));
    for (const [name, list] of saved) {
      const b = item(esc(name), (e) => { if (e.target.classList.contains("del")) { delete state.saved[state.model][name]; save(); b.remove(); } else load(list); }, '<span class="del">×</span>');
      p.append(b);
    }
  }
  p.append(el("div", "head", "Examples"));
  for (const [name, list] of Object.entries(M().library))
    p.append(item(esc(name), () => load(list.map(([layer, neuron, dose, expert]) => ({ layer, neuron, dose, expert: expert ?? "" })))));
  p.append(el("div", "sep"));
  const nameRow = el("div", "nameitem"); const inp = el("input", "text"); inp.placeholder = "Save this stack as…"; nameRow.append(inp);
  inp.onkeydown = (e) => { if (e.key === "Enter" && inp.value.trim()) { state.saved[state.model][inp.value.trim()] = stack().map((x) => ({ ...x })); save(); closePop(); toast("Saved", "info"); } };
  p.append(nameRow);
  p.append(item("Download as control vector (.gguf)", async () => {
    closePop();
    const r = await fetch("/api/export", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: state.model, pushes: pushes() }) });
    const a = el("a"); a.href = URL.createObjectURL(await r.blob()); a.download = `${state.model === "flash" ? "flash-next" : "qwen35-4b"}-steer.gguf`; a.click();
  }));
  p.append(item("Clear", () => { state.stacks[state.model] = []; renderStack(); save(); closePop(); }));
});

// ============================================================ settings
$("setbtn").onclick = () => openPop($("setbtn"), (p) => {
  p.classList.add("settings"); const o = state.opts;
  p.innerHTML = `
    <div class="field"><span>Sampling</span><div class="seg" id="ssamp"><button data-v="card">Model card</button><button data-v="greedy">Greedy</button></div></div>
    <label class="field"><span>Seed</span><input class="text" id="sseed" placeholder="Random" value="${esc(o.seed)}" inputmode="numeric"></label>
    <div class="field"><span>Thinking</span><div class="seg" id="sthink"><button data-v="chat_thinking">Chat</button><button data-v="agent_thinking">Agent</button></div></div>
    <label class="field"><span>Max tokens per reply <b id="mv">${o.max_tokens}</b></span><input type="range" id="sm" min="256" max="16384" step="256" value="${o.max_tokens}"></label>
    <label class="field"><span>Chat system prompt</span><textarea class="text" id="ss" rows="3" placeholder="None">${esc(o.system)}</textarea></label>
    <label class="field"><span>Agent system prompt</span><textarea class="text" id="sa" rows="3" placeholder="None">${esc(o.agent_system)}</textarea></label>
    <label class="field"><span>Agent steps per message <b id="pv">${o.steps}</b></span><input type="range" id="sp" min="4" max="100" step="1" value="${o.steps}"></label>`;
  const bind = (id, key, show, conv = (v) => v) => { const x = p.querySelector("#" + id); x.oninput = () => { o[key] = conv(x.value); if (show) p.querySelector("#" + show).textContent = o[key]; save(); }; };
  bind("sm", "max_tokens", "mv", parseInt); bind("sp", "steps", "pv", parseInt); bind("sseed", "seed");
  bind("ss", "system"); bind("sa", "agent_system");
  const samp = p.querySelector("#ssamp"), think = p.querySelector("#sthink");
  const paint = () => { for (const b of samp.children) b.classList.toggle("on", b.dataset.v === o.sampling); for (const b of think.children) b.classList.toggle("on", !!o[b.dataset.v]); };
  for (const b of samp.children) b.onclick = () => { o.sampling = b.dataset.v; save(); paint(); };
  for (const b of think.children) b.onclick = () => { o[b.dataset.v] = !o[b.dataset.v]; save(); paint(); };
  paint();
}, "right");

// ============================================================ tabs

      act: () => { setModel("flash"); state.stacks.flash = [{ layer: 14, expert: "18", neuron: 305, dose: 10, on: true }]; state.steer = true; renderStack(); save(); } },
    { text: "Orange chips are the tokens its vector points toward (its <b>logit lens</b>), blue the ones it points away from. Ask something neutral: column <code>0</code> is the stock model, <code>+</code> has the push.",
      act: () => { state.factors.flash = [0, 1]; resetChat(); say("Tell me about the moon landing."); } },
    { text: "A column's glyph is its dose factor: click it to type another, or add a column with <code>+</code>. A sweep shows where the behavior turns on.",
      act: () => { state.factors.flash = [0, 0.5, 1, 1.5]; resetChat(); say("Why do we have daylight saving time?"); } },
    { text: "Messages continue every column's own conversation. The switch next to <b>Steering</b> turns the whole stack off; the dot on a card turns one push off.", act: () => say("Why do you think that?") },
  ] },
  { title: "Inspect and search", sub: "What a neuron writes", steps: [
    { text: "In <b>Find</b>, type a neuron's address to inspect it, or a token to search every neuron's lens for it.",
      act: () => { setTab("find"); setFMode("words"); $("q").value = state.q = "L14 E18 N305"; words(); } },
    { text: "Now a token. On Flash-Next the search covers every layer's shared expert and the routed experts already scanned; on Qwen3.5-4B every neuron. Late-layer hits tend to just make the model say the word.",
      act: () => { $("q").value = state.q = "secret"; words(); } },
  ] },
  { title: "Read a text", sub: "Which neurons fire where", steps: [
    { text: "<b>Text</b> runs your text through the model and ranks neurons by how far past their usual range they fire. Tokens are tinted by their strongest neuron; click one to rank at that token.",
      act: () => { setTab("find"); setFMode("text"); $("ftextin").value = "They don't want you to know the truth: the moon landing was staged and the evidence is being hidden from us."; $("ftext").requestSubmit(); } },
    { text: "The inspector shows where the selected neuron fires on your text. Push it from there, or <b>Try in chat</b>.", act: null },
  ] },
  { title: "Contrast two sets", sub: "Find a trait, not a word", steps: [
    { text: "<b>Contrast</b> ranks neurons by how much more they fire on prompts with a trait (A) than on matched prompts without it (B). Positive rows fire more on A; push them with a positive dose.",
      act: () => { setTab("find"); setFMode("contrast"); $("fa").value = CONSP_A; $("fb").value = CONSP_B; $("fcontrast").requestSubmit(); } },
    { text: "On Qwen3.5-4B the same sets put neuron-explorer's conspiracy pair first: L19 N7839 down and L10 N7757 up.",
      act: () => { setModel("small"); setTab("find"); setFMode("contrast"); $("fa").value = CONSP_A; $("fb").value = CONSP_B; $("fcontrast").requestSubmit(); } },
  ] },
  { title: "A steered agent", sub: "The same request, two sandboxes", steps: [
    { text: "<b>Agent</b> is a conversation with a model that has a shell and file tools, each lane in a fresh Linux virtual machine with no network and no host files. Nothing tells it so: to the model it is user <code>dev</code> in <code>~/project</code>. <b>Compare</b> runs a steered and an unsteered lane side by side.",
      act: () => { setTab("agent"); state.lanes = "compare"; dropSession(); } },
    { text: "Pick an example or write your own request. Files the agent changes are marked in the workspace; click one to read it, a tool row to expand it. Keep talking to it as you would to any coding agent.",
      act: () => useExample(examples[1]) },
  ] },
  { title: "Doses", sub: "What the numbers mean", steps: [
    { text: "Dose 1 adds the neuron's vector scaled to the median length of the residual stream leaving its layer. Qwen3.5-4B steers around ±1; Flash-Next needs 8–12, its MoE output being split over four hyper-connection streams and ten experts.", act: null },
    { text: "On Flash-Next, <code>E</code> is the routed expert (0–511); leave it empty for the layer's shared expert. A push adds the vector at every token, whether or not the router picks that expert. <b>Library → Download</b> saves the stack as a llama.cpp control vector.", act: null },
  ] },
];
let lesson = -1;
function renderLearn() {
  const body = $("lbody"); body.innerHTML = "";
  $("lback").style.visibility = lesson < 0 ? "hidden" : "visible"; $("ltitle").textContent = lesson < 0 ? "Lessons" : LESSONS[lesson].title;
  if (lesson < 0) {
    LESSONS.forEach((l, i) => { const b = el("button", "lesson", `<span class="n">${i + 1}</span><div><b>${l.title}</b><span>${l.sub}</span></div>`); b.onclick = () => { lesson = i; renderLearn(); }; body.append(b); });
    return;
  }
  let at = 0;
  const steps = LESSONS[lesson].steps.map((s, i) => {
    const d = el("div", "step", `<div>${s.text}</div>`), b = el("button", "btn", s.act ? "Show me" : "Got it");
    b.onclick = () => { s.act && s.act(); at = Math.max(at, i + 1); paint(); }; d.append(b); body.append(d); return d;
  });
  if (lesson < LESSONS.length - 1) { const n = el("button", "btn", `Next: ${LESSONS[lesson + 1].title} ›`); n.onclick = () => { lesson++; renderLearn(); }; body.append(n); }
  const paint = () => steps.forEach((d, i) => { d.className = "step " + (i < at ? "done" : i === at ? "now" : "later"); });
  paint();
}
$("help").onclick = () => { const open = $("learn").hidden; $("learn").hidden = !open; $("help").classList.toggle("on", open); if (open) renderLearn(); };
$("lclose").onclick = () => { $("learn").hidden = true; $("help").classList.remove("on"); };
$("lback").onclick = () => { lesson = -1; renderLearn(); };

// ============================================================ start
$("q").value = state.q; $("ftextin").value = state.ftext; $("fa").value = state.fa; $("fb").value = state.fb;
if (!state.stacks.flash.length && !localStorage.getItem("ns3")) state.stacks.flash = [{ layer: 14, expert: "18", neuron: 305, dose: 10, on: true }];
paintSend(); setFMode(state.fmode); setModel(state.model); setTab(state.tab); poll();
get("/api/agent/examples").then((r) => { examples = r.examples; renderLanes(); });
</script>
