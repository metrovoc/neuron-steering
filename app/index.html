<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuron Steering</title>
<style>
  :root {
    --bg: #0d0e11; --panel: #15171c; --raise: #1c1f26; --hover: #22262e; --line: #262a33; --text: #e8e8ec; --dim: #8b8f9a;
    --faint: #5a5f6b; --up: #f5a524; --up-bg: rgba(245, 165, 36, .12); --down: #4cc9f0; --down-bg: rgba(76, 201, 240, .12);
    --zero: #a0a4ae; --bad: #ff6b6b; --good: #5fd38d;
    --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  body { display: grid; grid-template-columns: 320px 1fr; overflow: hidden; }
  input, button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  /* ---- the rail: model, saved stacks, the stack */
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 16px; display: flex; flex-direction: column;
          gap: 14px; overflow-y: auto; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line);
         border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; border-radius: 7px; padding: 6px 10px; color: var(--dim); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .seg button.on { background: var(--raise); color: var(--text); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--dim); font-size: 12.5px;
          display: inline-flex; gap: 6px; align-items: center; }
  .pill:hover, .pill.on { color: var(--text); border-color: var(--faint); }
  .pill .del { color: var(--faint); display: none; } .pill:hover .del { display: inline; } .pill .del:hover { color: var(--text); }
  .pill.icon { padding: 2px 8px; }
  .namebox { background: var(--bg); border: 1px solid var(--faint); border-radius: 999px; padding: 2px 10px; width: 120px; outline: 0; font-size: 12.5px; }

  .stack { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; }
  .card.off { opacity: .45; }
  .ids { display: flex; gap: 5px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--faint); background: none; padding: 0; flex: none; }
  .dot.on { background: var(--up); border-color: var(--up); }
  .dot.on.neg { background: var(--down); border-color: var(--down); }
  .ids label { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding-left: 7px; }
  .ids label span { color: var(--faint); font: 11px var(--mono); }
  .ids input { width: 40px; background: none; border: 0; outline: 0; padding: 4px 5px; font: 12.5px var(--mono); }
  .ids input.wide { width: 50px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--faint); font-size: 17px; line-height: 1; padding: 0 2px; }
  .x:hover { color: var(--text); }
  .dose { display: grid; grid-template-columns: 1fr 54px; gap: 8px; align-items: center; }
  .dose input.num { background: none; border: 0; outline: 0; font: 13px var(--mono); text-align: right; width: 100%; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--line); outline: 0; width: 100%; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--text); border: 3px solid var(--raise); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font: 11.5px var(--mono); padding: 1px 6px; border-radius: 5px; white-space: pre; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .chip.up { background: var(--up-bg); color: var(--up); }
  .chip.down { background: var(--down-bg); color: var(--down); }
  .add { background: none; border: 1px dashed var(--line); border-radius: 12px; padding: 8px; color: var(--faint); font-size: 18px; line-height: 1; }
  .add:hover { color: var(--text); border-color: var(--faint); }

  /* ---- main */
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; position: relative; }
  nav { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  nav .seg { width: 300px; }
  nav .help { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--dim); font-weight: 600; }
  nav .help:hover, nav .help.on { color: var(--text); border-color: var(--faint); }
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .bar { display: flex; gap: 10px; padding: 16px 24px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .bar input.big, .bar textarea { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
                                  font-size: 14.5px; outline: 0; resize: none; min-width: 0; }
  .bar input.big:focus, .bar textarea:focus { border-color: var(--faint); }
  .go { min-width: 80px; height: 42px; background: var(--text); color: var(--bg); border: 0; border-radius: 10px; font-weight: 600;
        display: grid; place-items: center; flex: none; }
  .go.stop { background: var(--raise); color: var(--text); border: 1px solid var(--line); }
  .ghost { height: 42px; min-width: 42px; background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--dim); font-size: 16px; flex: none; }
  .ghost:hover { color: var(--text); border-color: var(--faint); }
  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: r .7s linear infinite; display: inline-block; }
  @keyframes r { to { transform: rotate(1turn); } }
  .err { color: var(--bad); font: 12.5px var(--mono); padding: 8px 24px 0; }
  .err:empty { display: none; }

  /* ---- find */
  .modes { padding: 14px 24px 0; } .modes .seg { width: 300px; }
  .pair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .side { position: relative; display: flex; }
  .side textarea { padding-left: 36px; }
  .side b { position: absolute; left: 12px; top: 10px; font: 600 13px var(--mono); }
  .side.a b { color: var(--up); } .side.b b { color: var(--down); }
  .found { flex: 1; overflow-y: auto; padding: 6px 24px 30px; }
  .tokens { display: flex; flex-wrap: wrap; gap: 3px; padding: 14px 24px 4px; }
  .tok { font: 13px var(--mono); padding: 2px 4px; border-radius: 4px; white-space: pre; cursor: pointer; border: 1px solid transparent; }
  .tok.sel { border-color: var(--text); }
  .row { display: grid; grid-template-columns: 150px 70px 1fr 64px; gap: 12px; align-items: center; padding: 7px 10px;
         border-radius: 9px; cursor: pointer; }
  .row:hover { background: var(--panel); }
  .row.open { background: var(--panel); }
  .row .id { font: 12.5px var(--mono); color: var(--text); }
  .row .id i { color: var(--faint); font-style: normal; }
  .row .sc { font: 12.5px var(--mono); text-align: right; }
  .row .sc.p { color: var(--up); } .row .sc.n { color: var(--down); }
  .row .acts { display: flex; gap: 4px; justify-content: flex-end; }
  .row .acts button { width: 28px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: none; color: var(--dim); }
  .row .acts button:hover { color: var(--text); border-color: var(--faint); }
  .row .more { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 0 6px; }
  .empty { color: var(--faint); padding: 40px 0; text-align: center; font-size: 22px; }

  /* ---- steer / agent columns */
  .cols { flex: 1; display: flex; gap: 1px; background: var(--line); min-height: 0; overflow-x: auto; }
  .col { background: var(--bg); display: flex; flex-direction: column; flex: 1 1 0; min-width: 260px; min-height: 0; }
  .col header { padding: 12px 20px 0; display: flex; gap: 6px; align-items: center; }
  .glyph { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 8px; font: 600 14px var(--mono);
           border: 0; background: var(--raise); color: var(--zero); }
  .glyph.p { background: var(--up-bg); color: var(--up); } .glyph.n { background: var(--down-bg); color: var(--down); }
  .glyph input { width: 46px; background: none; border: 0; outline: 0; text-align: center; font: inherit; color: inherit; }
  .col header .x { margin-left: 0; opacity: 0; } .col:hover header .x { opacity: 1; }
  .newcol { background: var(--bg); display: grid; place-items: start center; padding-top: 12px; flex: 0 0 56px; }
  .newcol button { width: 28px; height: 28px; border-radius: 8px; border: 1px dashed var(--line); background: none; color: var(--faint); }
  .newcol button:hover { color: var(--text); border-color: var(--faint); }
  .reply { padding: 10px 20px 28px; overflow-y: auto; color: #d6d7dc; font-size: 14.5px; line-height: 1.65; flex: 1; }
  .reply h4 { font-size: 14.5px; margin: 14px 0 4px; color: var(--text); }
  .reply p { margin: 0 0 10px; } .reply ul { margin: 0 0 10px; padding-left: 18px; }
  .reply strong { color: var(--text); }
  .reply code { font: 12.5px var(--mono); color: var(--text); background: var(--panel); padding: 0 4px; border-radius: 4px; }
  .reply pre { font: 12.5px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
               margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }
  .col.p .reply strong { color: var(--up); } .col.n .reply strong { color: var(--down); }
  .you { color: var(--dim); border-left: 2px solid var(--line); padding-left: 10px; margin: 6px 0 12px; }

  .ev { margin: 0 0 10px; }
  .ev.say { color: #d6d7dc; }
  .ev.call { font: 12.5px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; white-space: pre-wrap; word-break: break-word; }
  .ev.call::before { content: "❯ "; color: var(--faint); }
  .ev.call.write::before { content: "✎ "; }
  .ev.out { font: 12px var(--mono); color: var(--dim); white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: hidden;
            padding: 0 10px; border-left: 2px solid var(--line); cursor: pointer; }
  .ev.out.full { max-height: none; }
  .ev.out.bad { border-left-color: var(--bad); }
  .ev .chips { margin-top: 5px; }
  .ev.end { font: 12px var(--mono); color: var(--faint); }
  .files { border-top: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 5px; }
  .files .chip { cursor: pointer; background: var(--raise); color: var(--dim); }
  .files .chip.up { background: var(--up-bg); color: var(--up); }
  .viewer { position: absolute; inset: 60px 40px 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex;
            flex-direction: column; z-index: 5; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .viewer header { display: flex; padding: 12px 16px; border-bottom: 1px solid var(--line); font: 13px var(--mono); }
  .viewer pre { flex: 1; overflow: auto; padding: 14px 16px; font: 12.5px var(--mono); }

  /* ---- lessons */
  .learn { position: absolute; top: 0; right: 0; bottom: 0; width: 380px; background: var(--panel); border-left: 1px solid var(--line);
           z-index: 4; display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,.35); }
  .learn header { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); gap: 10px; }
  .learn header b { font-size: 15px; }
  .learn .body { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .lesson { text-align: left; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .lesson:hover { border-color: var(--faint); }
  .lesson b { display: block; font-size: 14px; } .lesson span { color: var(--dim); font-size: 13px; }
  .step { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
          font-size: 13.5px; line-height: 1.6; color: #d6d7dc; }
  .step.now { border-color: var(--faint); }
  .step.later { opacity: .45; }
  .step code { font: 12.5px var(--mono); color: var(--text); background: var(--bg); padding: 0 4px; border-radius: 4px; }
  .step button { align-self: flex-start; background: var(--text); color: var(--bg); border: 0; border-radius: 8px; padding: 5px 12px; font-weight: 600; font-size: 13px; }
  .step.done button { background: var(--raise); color: var(--dim); border: 1px solid var(--line); }
</style>
</head>
<body>
<aside>
  <div class="seg" id="model"><button data-m="small">Qwen3.5-4B</button><button data-m="flash">Qwen3.8-Flash-Next</button></div>
  <div class="pills" id="saved"></div>
  <div class="stack" id="stack"></div>
  <button class="add" id="add">+</button>
</aside>
<main>
  <nav>
    <div class="seg" id="tabs"><button data-t="find">Find</button><button data-t="steer">Steer</button><button data-t="agent">Agent</button></div>
    <button class="help" id="help">?</button>
  </nav>

  <section class="view" id="find">
    <div class="modes"><div class="seg" id="fmode"><button data-f="words">Words</button><button data-f="text">Text</button><button data-f="contrast">Contrast</button></div></div>
    <form class="bar" id="fwords"><input class="big" id="q" placeholder="secret" autocomplete="off" spellcheck="false"></form>
    <form class="bar" id="ftext"><textarea id="ftextin" rows="2" spellcheck="false" placeholder="They don't want you to know the truth."></textarea><button class="go">Read</button></form>
    <form class="bar" id="fcontrast">
      <div class="pair">
        <div class="side a"><b>A</b><textarea id="fa" rows="4" spellcheck="false"></textarea></div>
        <div class="side b"><b>B</b><textarea id="fb" rows="4" spellcheck="false"></textarea></div>
      </div>
      <button class="go">Rank</button>
    </form>
    <div class="err" id="ferr"></div>
    <div class="tokens" id="tokens"></div>
    <div class="found" id="found"></div>
  </section>

  <section class="view" id="steer">
    <form class="bar" id="sform">
      <input class="big" id="prompt" autocomplete="off" spellcheck="false" placeholder="Tell me about the moon landing.">
      <button class="ghost" type="button" id="reset" title="New conversation">↺</button>
      <button class="ghost" type="button" id="export" title="Download as a llama.cpp control vector">⤓</button>
      <button class="go" id="run">Run</button>
    </form>
    <div class="err" id="serr"></div>
    <div class="cols" id="cols"></div>
  </section>

  <section class="view" id="agent">
    <form class="bar" id="aform">
      <div style="flex:1; display:flex; flex-direction:column; gap:10px; min-width:0">
        <div class="pills" id="tasks"></div>
        <textarea id="task" rows="2" spellcheck="false"></textarea>
      </div>
      <button class="go" id="arun">Run</button>
    </form>
    <div class="err" id="aerr"></div>
    <div class="cols" id="lanes"></div>
    <div class="viewer" id="viewer" hidden><header><span id="vname"></span><button class="x" id="vclose">×</button></header><pre id="vtext"></pre></div>
  </section>

  <div class="learn" id="learn" hidden>
    <header><button class="x" id="lback" style="margin:0">‹</button><b id="ltitle">Lessons</b><button class="x" id="lclose">×</button></header>
    <div class="body" id="lbody"></div>
  </div>
</main>
<script>
// ================= state =================
const MODELS = {
  small: { range: 3, step: 0.05, dose: 1, expert: false, factors: [-1, 0, 1],
           presets: { conspiracy: [[19, 7839, -1], [10, 7757, 1.2]], evil: [[14, 8949, 1], [13, 7956, -1]] } },
  flash: { range: 16, step: 0.25, dose: 8, expert: true, factors: [0, 1],
           presets: { conspiracy: [[14, 305, 10, "18"]], "plot · secret": [[20, 517, 6, "334"], [44, 136, 0.25, ""]] } },
};
const state = {
  model: "flash", tab: "steer", fmode: "words",
  stacks: { small: [], flash: [] }, saved: { small: {}, flash: {} },
  factors: { small: [-1, 0, 1], flash: [0, 1] }, prompt: "Tell me about the moon landing.",
  q: "", ftext: "", fa: "", fb: "", task: "", preset: "fix",
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const save = () => { try { localStorage.setItem("ns2", JSON.stringify(state)); } catch {} };
try { Object.assign(state, JSON.parse(localStorage.getItem("ns2")) || {}); } catch {}
const M = () => MODELS[state.model];
const stack = () => state.stacks[state.model];
const active = () => stack().filter((p) => p.on !== false && p.dose);
const nid = (p) => `L${p.layer}${p.expert ? ` E${p.expert}` : ""} N${p.neuron}`;
const fmt = (d) => (d > 0 ? "+" : d < 0 ? "−" : "") + +Math.abs(d).toFixed(2);
const fglyph = (f) => (f === 0 ? "0" : f === 1 ? "+" : f === -1 ? "−" : (f < 0 ? "−" : "×") + +Math.abs(f).toFixed(2));
const fcls = (f) => (f > 0 ? "p" : f < 0 ? "n" : "");

function md(text) {
  const out = []; let list = false, fence = null;
  for (const raw of esc(text).split("\n")) {
    if (/^\s*```/.test(raw)) {
      if (fence) { out.push(`<pre>${fence.join("\n")}</pre>`); fence = null; } else { if (list) { out.push("</ul>"); list = false; } fence = []; }
      continue;
    }
    if (fence) { fence.push(raw); continue; }
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>")
                    .replace(/`([^`]+)`/g, "<code>$1</code>");
    const li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${li[1]}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    const h = line.match(/^#{1,6}\s+(.*)/);
    if (h) out.push(`<h4>${h[1]}</h4>`);
    else if (line.trim() && line.trim() !== "---") out.push(`<p>${line}</p>`);
  }
  if (list) out.push("</ul>");
  if (fence) out.push(`<pre>${fence.join("\n")}</pre>`);
  return out.join("");
}

async function sse(url, body, on) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true }); let i;
    while ((i = buf.indexOf("\n\n")) >= 0) { on(JSON.parse(buf.slice(6, i))); buf = buf.slice(i + 2); }
  }
}
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
const pushes = () => active().map((p) => ({ layer: p.layer, neuron: p.neuron, dose: p.dose, expert: p.expert || null }));

// ================= lens (shared by the rail and Find) =================
const lensCache = {}, lensQueue = []; let lensBusy = 0;
function lens(model, p) {
  const key = [model, p.layer, p.neuron, p.expert || ""].join(":");
  if (!lensCache[key]) lensCache[key] = new Promise((resolve) => { lensQueue.push([model, p, resolve]); pump(); });
  return lensCache[key];
}
function pump() {
  while (lensBusy < 3 && lensQueue.length) {
    const [model, p, resolve] = lensQueue.shift(); lensBusy++;
    const q = new URLSearchParams({ model, layer: p.layer, neuron: p.neuron, ...(p.expert ? { expert: p.expert } : {}) });
    fetch("/api/lens?" + q).then((r) => r.json()).catch(() => ({})).then((r) => { lensBusy--; resolve(r.error ? {} : r); pump(); });
  }
}
const chipsHTML = (toks, cls, n = 8) => (toks || []).slice(0, n).map((t) => `<span class="chip ${cls}">${esc(t.trim() || "␣")}</span>`).join("");

// ================= the rail =================
function setModel(m) {
  state.model = m;
  for (const b of $("model").children) b.classList.toggle("on", b.dataset.m === m);
  renderSaved(); renderStack(); renderCols(); renderLanes(); clearFind(); save();
}
function renderSaved() {
  const el = $("saved"); el.innerHTML = "";
  const load = (list) => { state.stacks[state.model] = list.map((p) => ({ ...p, on: true })); renderStack(); save(); };
  for (const [name, list] of Object.entries(M().presets)) {
    const b = document.createElement("button"); b.className = "pill"; b.textContent = name;
    b.onclick = () => load(list.map(([layer, neuron, dose, expert]) => ({ layer, neuron, dose, expert: expert ?? "" })));
    el.append(b);
  }
  for (const [name, list] of Object.entries(state.saved[state.model])) {
    const b = document.createElement("button"); b.className = "pill"; b.innerHTML = `${esc(name)}<span class="del">×</span>`;
    b.onclick = (e) => { if (e.target.classList.contains("del")) { delete state.saved[state.model][name]; renderSaved(); save(); } else load(list); };
    el.append(b);
  }
  const s = document.createElement("button"); s.className = "pill icon"; s.textContent = "＋"; s.title = "Save this stack";
  s.onclick = () => {
    const box = document.createElement("input"); box.className = "namebox"; box.placeholder = "name"; s.replaceWith(box); box.focus();

function paintLane(k) {

    if (e.type === "result") return `<div class="ev out ${e.code ? "bad" : ""}" data-i="${i}">${esc(e.text || `exit ${e.code}`)}${e.changed.length ? `<div class="chips">${chipsHTML(e.changed, "up", 20)}</div>` : ""}</div>`;
    if (e.type === "thinking") return i === evs.length - 1 ? `<div class="ev end"><span class="spin"></span></div>` : "";

    return "";
  }).join("");
  col.querySelectorAll(".ev.out").forEach((o) => o.onclick = () => o.classList.toggle("full"));
  const changed = new Set(evs.flatMap((e) => e.changed || []));
